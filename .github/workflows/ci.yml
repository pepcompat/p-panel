# pPanel CI skeleton (P0.03). Deterministic, no secrets required, never deploys anywhere.
# Live/lab E2E against real VMs is NOT run here (see docs/TEST_REPORT.md: BLOCKED/NOT RUN).
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'
  GO_VERSION: '1.26.11' # matches apps/agent/go.mod toolchain (1.25 line has unfixed stdlib vulns)

jobs:
  node:
    name: node (lint / typecheck / unit + integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: ppanel
          POSTGRES_PASSWORD: ppanel_ci_only
          POSTGRES_DB: ppanel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ppanel"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only throwaway values; nothing here is a real credential.
      DATABASE_URL: postgresql://ppanel:ppanel_ci_only@127.0.0.1:5432/ppanel?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Generate per-run CI secrets (never printed)
        run: |
          {
            echo "PPANEL_MASTER_KEY=$(openssl rand -base64 32)"
            echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)"
            echo "PPANEL_SETUP_TOKEN=$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"
      - name: Prisma migrate (fresh DB) + drift check
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          PGPASSWORD=ppanel_ci_only psql -h 127.0.0.1 -U ppanel -d ppanel -c 'CREATE DATABASE ppanel_shadow'
          # fails if schema.prisma has changes without a migration (allowlisted raw-SQL objects ignored)
          SHADOW_DATABASE_URL="postgresql://ppanel:ppanel_ci_only@127.0.0.1:5432/ppanel_shadow" \
            scripts/check-migration-drift.sh
      - name: Integration tests (API against service Postgres/Redis)
        env:
          TEST_DATABASE_BASE: postgresql://ppanel:ppanel_ci_only@127.0.0.1:5432
        run: pnpm test:integration
      - name: Security suite (authz matrix, IDOR, SSRF, injection, canary secret scan)
        env:
          TEST_DATABASE_BASE: postgresql://ppanel:ppanel_ci_only@127.0.0.1:5432
        run: pnpm test:security
      - name: Shared validators property tests (fast-check)
        run: pnpm --filter @ppanel/shared-contracts test:fuzz

  go:
    name: go (vet / test -race)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/agent/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test ./... -race -cover
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: Go fuzz smoke (10 s per fuzzer; full runs are manual, see SECURITY_BOUNDARIES.md)
        run: |
          set -euo pipefail
          for pkg in $(go list ./...); do
            for fz in $(go test -list '^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
              echo "== $pkg $fz"
              go test "$pkg" -run '^$' -fuzz "^${fz}\$" -fuzztime 10s
            done
          done
      - name: Cross-build agent (linux amd64/arm64, static)
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o bin/ppanel-agent-linux-$arch ./cmd/...
          done

  compose:
    name: compose config validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose version
          docker compose -f infra/compose/dev.yml config --quiet
          docker compose -f infra/compose/lab.yml config --quiet
      - name: Lab images build (no run, no push)
        run: docker compose -f infra/compose/lab.yml build
      - name: Shell syntax of lab scripts
        run: |
          for f in scripts/lab/*.sh; do bash -n "$f"; done
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            -x scripts/lab/*.sh scripts/backup/*.sh scripts/observability/*.sh infra/lab/node/entrypoint.sh

  secrets:
    name: gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned image, full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --no-banner --redact --exit-code 1

  images:
    name: production images (build only, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build Center API image (apps/api/Dockerfile)
        if: hashFiles('apps/api/Dockerfile') != ''
        run: |
          docker build -f apps/api/Dockerfile -t "ppanel-api:ci-${GITHUB_SHA::12}" \
            --build-arg PPANEL_VERSION="$(cat VERSION 2>/dev/null || echo 0.0.0-ci)" \
            --build-arg PPANEL_COMMIT="${GITHUB_SHA::12}" \
            --build-arg PPANEL_BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      - name: Build web image (apps/web/Dockerfile)
        if: hashFiles('apps/web/Dockerfile') != ''
        run: |
          docker build -f apps/web/Dockerfile -t "ppanel-web:ci-${GITHUB_SHA::12}" \
            --build-arg PPANEL_VERSION="$(cat VERSION 2>/dev/null || echo 0.0.0-ci)" \
            --build-arg PPANEL_COMMIT="${GITHUB_SHA::12}" .
      - name: Report missing Dockerfiles
        if: hashFiles('apps/api/Dockerfile') == '' || hashFiles('apps/web/Dockerfile') == ''
        run: |
          [ -f apps/api/Dockerfile ] || echo "::notice::apps/api/Dockerfile not present; API image build skipped"
          [ -f apps/web/Dockerfile ] || echo "::notice::apps/web/Dockerfile not present; web image build skipped"

  journeys:
    name: playwright user journeys (real UI + real API, no lab agents)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: ppanel
          POSTGRES_PASSWORD: ppanel_ci_only
          POSTGRES_DB: ppanel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ppanel"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only throwaway DB credentials; API secrets are generated per run by journeys.sh.
      JOURNEYS_PG_BASE: postgresql://ppanel:ppanel_ci_only@127.0.0.1:5432
      JOURNEYS_PSQL: host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @ppanel/web exec playwright install --with-deps chromium
      - name: Journeys J01 (first boot + 2FA) and J11 (RBAC denial audited)
        env:
          JOURNEYS_ARTIFACTS: ${{ runner.temp }}/journeys
        run: scripts/lab/journeys.sh
      - name: Upload journey report + screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journeys-report
          path: |
            ${{ runner.temp }}/journeys/results.json
            ${{ runner.temp }}/journeys/screens/
            ${{ runner.temp }}/journeys/html/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload traces, videos and server logs (failure only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journeys-traces
          path: |
            ${{ runner.temp }}/journeys/test-results/
            ${{ runner.temp }}/journeys/*.log
          if-no-files-found: ignore
          retention-days: 14
