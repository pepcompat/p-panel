# pPanel release (docs/RELEASE_CONTRACT.md §1/§3). Triggered by a tag v<VERSION>.
# - multi-arch images ghcr.io/pepcompat/ppanel-{api,web}:<version> (linux/amd64 + linux/arm64)
# - agent binaries, install-agent.sh, Center bundle, SHA256SUMS (scripts/release/build.sh)
# - SHA256SUMS.sig + ppanel-release.pub when secret PPANEL_RELEASE_SIGNING_KEY (ed25519 PEM) exists,
#   otherwise the release is marked UNSIGNED in its notes
# - GitHub release with every artifact (prerelease for -rc/-beta versions)
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/pepcompat/

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4.2.2
      - id: v
        name: Tag must equal the VERSION file
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match VERSION ${version} (scripts/release/set-version.sh)"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  images:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Build metadata
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6.18.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}ppanel-${{ matrix.service }}:${{ needs.version.outputs.version }}
          build-args: |
            PPANEL_VERSION=${{ needs.version.outputs.version }}
            PPANEL_COMMIT=${{ steps.meta.outputs.commit }}
            PPANEL_BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p digests
          echo "${IMAGE_PREFIX}ppanel-${SERVICE}:${VERSION}@${DIGEST}" > "digests/${SERVICE}.txt"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.txt
          retention-days: 7

  artifacts:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum
      - name: Agent binaries, install-agent.sh, Center bundle, SHA256SUMS (+ signature)
        env:
          SIGNING_KEY: ${{ secrets.PPANEL_RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          args=(--version "$VERSION" --out dist-release/out --skip-images)
          if [ -n "${SIGNING_KEY}" ]; then
            key="$(mktemp)"
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$SIGNING_KEY" > "$key"
            chmod 600 "$key"
            args+=(--sign-key "$key")
          fi
          scripts/release/build.sh "${args[@]}"
          ls -la dist-release/out
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: release-files
          path: dist-release/out/
          retention-days: 7

  release:
    needs: [version, images, artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # download only what the release needs: docker/build-push-action also uploads *.dockerbuild
      # build records, which download-artifact cannot extract when downloading everything
      - uses: actions/download-artifact@v4.3.0
        with:
          name: release-files
          path: dl/release-files
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: digest-*
          path: dl
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          files=(dl/release-files/*)
          {
            echo "pPanel ${VERSION}"
            echo
            echo "Images (pin these references in /opt/ppanel/.env):"
            echo
            echo '```'
            cat dl/digest-api/api.txt dl/digest-web/web.txt
            echo '```'
            echo
            if [ -f dl/release-files/SHA256SUMS.sig ]; then
              echo "Signed: SHA256SUMS.sig (ed25519). Verify:"
              printf '%s\n' "\`openssl pkeyutl -verify -pubin -inkey ppanel-release.pub -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig\`"
            else
              echo "**UNSIGNED release**: no SHA256SUMS.sig. Verify SHA256SUMS over a trusted channel."
            fi
            echo
            echo "Install: docs/INSTALL.md. Upgrade: docs/UPGRADE_RUNBOOK.md."
          } > notes.md
          flags=(--title "pPanel ${VERSION}" --notes-file notes.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" "${files[@]}"
