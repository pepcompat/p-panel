# pPanel LAB — disposable "node" containers that approximate Ubuntu 24.04 VMs.
# Project name is fixed to `ppanel-lab`; use scripts/lab/{up,down,status,checksum-nginx}.sh.
# Nothing is published on any host interface: tests reach sites via `docker exec ... curl -H Host:`.
# Containers are NOT VMs — see infra/lab/README.md for limitations and which tests stay BLOCKED.
name: ppanel-lab

x-node-common: &node-common
  init: false # tini is the image ENTRYPOINT (PID 1)
  restart: 'no'
  extra_hosts:
    # lets the in-container agent reach the Center API (:4000) / agent gateway (:4443) on the Mac host
    - 'host.docker.internal:host-gateway'
  networks: [labnet]
  cap_drop: [ALL]
  # minimum caps for nginx/php-fpm master to bind :80/:443 and drop to www-data
  cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE, KILL]
  security_opt: ['no-new-privileges:true']
  healthcheck:
    test: ['CMD-SHELL', 'test -s /run/nginx.pid && kill -0 $(cat /run/nginx.pid)']
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s
  labels:
    com.ppanel.lab: 'true'

services:
  lab-node-a:
    <<: *node-common
    image: ppanel-lab-node-a:dev
    build:
      context: ..
      dockerfile: lab/node/Dockerfile
      args: { NODE_ROLE: a, WITH_PHP: '1' }
    container_name: ppanel-lab-node-a
    hostname: lab-node-a
    environment:
      PPANEL_LAB_PHP_FPM: '1'
    volumes:
      - ${PPANEL_AGENT_BIN_DIR:-../../.lab/agent-bin}:/opt/ppanel-agent:ro
      - node-a-agent-state:/var/lib/ppanel-agent
    depends_on:
      lab-upstream-a: { condition: service_healthy }

  lab-node-b:
    <<: *node-common
    image: ppanel-lab-node-b:dev
    build:
      context: ..
      dockerfile: lab/node/Dockerfile
      args: { NODE_ROLE: b, WITH_PHP: '0' }
    container_name: ppanel-lab-node-b
    hostname: lab-node-b
    volumes:
      - ${PPANEL_AGENT_BIN_DIR:-../../.lab/agent-bin}:/opt/ppanel-agent:ro
      - node-b-agent-state:/var/lib/ppanel-agent
    depends_on:
      lab-upstream-b: { condition: service_healthy }

  # Tiny upstream behind node-a's reverse-proxy fixture (03-proxy-api.conf).
  lab-upstream-a:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    container_name: ppanel-lab-upstream-a
    command: ['httpd', '-f', '-v', '-p', '8080', '-h', '/www']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ../lab/upstream/a:/www:ro
    networks: [labnet]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/health/']
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      com.ppanel.lab: 'true'

  # Compose-like static app behind node-b (10-shop-compose.conf).
  lab-upstream-b:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    container_name: ppanel-lab-upstream-b
    command: ['httpd', '-f', '-v', '-p', '8080', '-h', '/www']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ../lab/upstream/b:/www:ro
    networks: [labnet]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      com.ppanel.lab: 'true'
      com.docker.compose.fixture.project: shop

networks:
  labnet:
    name: ppanel-lab-net
    driver: bridge

volumes:
  node-a-agent-state: {}
  node-b-agent-state: {}
