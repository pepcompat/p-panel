# pPanel LAB — disposable "node" containers that approximate Ubuntu 24.04 VMs.
# Project name is fixed to `ppanel-lab`; use scripts/lab/{up,down,status,checksum-nginx}.sh.
# Only ONE port is published, loopback-only: the P4 lab registry on 127.0.0.1:55000 (image push from the Mac).
# Sites are reached via `docker exec ... curl -H Host:`.
# P4: lab-node-b gets a docker-in-docker sidecar (lab-dind, PRIVILEGED — lab only, see infra/lab/README.md).
# P4b: lab-node-b is the BUILD NODE (git installed, agent config mounted with build.enabled + gitHostsAllowlist
#      [lab-git]); lab-git serves the fixture repos (.lab/git, scripts/lab/git-fixtures.sh) over git:// read-only.
# P6: lab-backup (rest-server --private-repos --append-only; the nodes' ONLY backup endpoint, lab network only),
#     lab-backup-admin (full-access maintenance identity on the SAME data; NOT on the nodes' network, published on
#     127.0.0.1:58001 only) and lab-minio (offsite S3, 127.0.0.1:59000 only). Credentials are generated into the
#     gitignored .lab/backup/ by scripts/lab/backup-secrets.sh (called by up.sh). Lab shortcut: http, not https.
# P9 (profile `p9`, scripts/lab/p9-net.sh only): lab-center-private (private gateway forwarder on two internal
#     "VPC" networks), lab-do-fake (fake DigitalOcean API + droplet metadata, 127.0.0.1:58090) and lab-gateway.
# P10 (profile `p10`, scripts/lab/p10-ssh.sh only): lab-node-s, the SSH gateway target (sshd on 127.0.0.1:52222).
# Containers are NOT VMs — see infra/lab/README.md for limitations and which tests stay BLOCKED.
name: ppanel-lab

x-node-common: &node-common
  init: false # tini is the image ENTRYPOINT (PID 1)
  restart: 'no'
  extra_hosts:
    # lets the in-container agent reach the Center API (:4000) / agent gateway (:4443) on the Mac host
    - 'host.docker.internal:host-gateway'
  networks: [labnet]
  cap_drop: [ALL]
  # minimum caps for nginx/php-fpm master to bind :80/:443 and drop to www-data
  cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE, KILL]
  security_opt: ['no-new-privileges:true']
  healthcheck:
    test: ['CMD-SHELL', 'test -s /run/nginx.pid && kill -0 $(cat /run/nginx.pid)']
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s
  labels:
    com.ppanel.lab: 'true'

services:
  lab-node-a:
    <<: *node-common
    image: ppanel-lab-node-a:dev
    build:
      context: ..
      dockerfile: lab/node/Dockerfile
      args: { NODE_ROLE: a, WITH_PHP: '1' }
    container_name: ppanel-lab-node-a
    hostname: lab-node-a
    environment:
      PPANEL_LAB_PHP_FPM: '1'
    volumes:
      - ${PPANEL_AGENT_BIN_DIR:-../../.lab/agent-bin}:/opt/ppanel-agent:ro
      - node-a-agent-state:/var/lib/ppanel-agent
      # P6: operator-side agent config (backup.enabled, host restic). Read-only.
      - ../lab/node/agent-config/node-a.yaml:/etc/ppanel-agent/config.yaml:ro
    depends_on:
      lab-upstream-a: { condition: service_healthy }

  lab-node-b:
    <<: *node-common
    image: ppanel-lab-node-b:dev
    build:
      context: ..
      dockerfile: lab/node/Dockerfile
      args: { NODE_ROLE: b, WITH_PHP: '0', WITH_GIT: '1' }
    container_name: ppanel-lab-node-b
    hostname: lab-node-b
    environment:
      # entrypoint links /var/run/docker.sock -> /run/dind/docker.sock (socket of the lab-dind sidecar)
      PPANEL_LAB_DIND_SOCKET: /run/dind/docker.sock
    volumes:
      - ${PPANEL_AGENT_BIN_DIR:-../../.lab/agent-bin}:/opt/ppanel-agent:ro
      - node-b-agent-state:/var/lib/ppanel-agent
      - node-b-dind-sock:/run/dind
      # P4b: operator-side agent config (build node). Produced by the lab tooling, read-only.
      - ../lab/node/agent-config/node-b.yaml:/etc/ppanel-agent/config.yaml:ro
    depends_on:
      lab-upstream-b: { condition: service_healthy }
      lab-git: { condition: service_healthy }

  # P4 deploy target engine for lab-node-b. Docker-in-docker that SHARES node-b's network namespace,
  # so containers it publishes on 127.0.0.1:<port> are on node-b's loopback (like a real host where
  # dockerd and nginx share the host network). Its API socket is on a shared volume, linked into
  # node-b at /var/run/docker.sock. The pPanel agent in node-b talks to it via the Engine API only.
  # !!! privileged: true is REQUIRED by dind and is allowed ONLY for this lab sidecar. NEVER a
  # !!! production pattern; pPanel itself never runs privileged containers.
  lab-dind:
    image: docker:29.0.4-dind@sha256:c9699f4fc7365e8daad3eb48ce3b62dc118b2a5267f7be7bcd3c4e4b2f1cfb4c
    container_name: ppanel-lab-dind
    restart: 'no'
    privileged: true # LAB ONLY — see infra/lab/README.md "docker-in-docker (P4)"
    network_mode: 'service:lab-node-b'
    environment:
      DOCKER_TLS_CERTDIR: '' # unix socket only, no TCP listener
    command:
      - dockerd
      - --host=unix:///run/dind/docker.sock
      - --insecure-registry=lab-registry:5000
      - --bip=10.213.0.1/24
      - --default-address-pool=base=10.214.0.0/16,size=24
      - --log-level=warn
    volumes:
      - node-b-dind-sock:/run/dind
      - node-b-dind-data:/var/lib/docker
    depends_on:
      lab-node-b: { condition: service_healthy }
      lab-registry: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'docker',
          '-H',
          'unix:///run/dind/docker.sock',
          'version',
          '--format',
          '{{.Server.Version}}',
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    labels:
      com.ppanel.lab: 'true'

  # Lab-only TCP forwarder so the SAME image reference works for the Center (on the Mac,
  # 127.0.0.1:55000 -> published registry port) and for dind inside node-b's network namespace
  # (127.0.0.1:55000 -> lab-registry:5000). Needed for webhook auto-deploy, where the Center resolves
  # a tag to a digest and dind then pulls that exact reference. Docker treats 127.0.0.0/8 registries
  # as insecure by default, so no dind flag change is needed.
  lab-registry-fwd:
    image: alpine/socat:1.8.0.1@sha256:87d88ff79bf42ca723fb360e9585c40e2923a2f4df9b9d148b127568ef6b99e7
    container_name: ppanel-lab-registry-fwd
    restart: 'no'
    network_mode: 'service:lab-node-b'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command: ['tcp-listen:55000,bind=127.0.0.1,fork,reuseaddr', 'tcp:lab-registry:5000']
    depends_on:
      lab-node-b: { condition: service_healthy }
      lab-registry: { condition: service_healthy }
    labels:
      com.ppanel.lab: 'true'

  # P4 local OCI registry: dind pulls lab-registry:5000/ppanel-test/* (insecure, lab network only);
  # the Mac pushes via 127.0.0.1:55000 (published on loopback ONLY).
  lab-registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    container_name: ppanel-lab-registry
    hostname: lab-registry
    restart: 'no'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [labnet]
    ports:
      - '127.0.0.1:55000:5000'
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'false'
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:5000/v2/']
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # P4b lab git server: read-only `git daemon` (git://lab-git/<name>.git) for the fixture repos built by
  # scripts/lab/git-fixtures.sh into .lab/git. Lab network only, not published. git:// is accepted by
  # node-b's agent only because its build.gitHostsAllowlist names `lab-git` (lab-only; production = https).
  lab-git:
    image: ppanel-lab-git:dev
    build:
      context: ../lab/git-daemon
    container_name: ppanel-lab-git
    hostname: lab-git
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [labnet]
    volumes:
      - ${PPANEL_LAB_GIT_DIR:-../../.lab/git}:/srv/git:ro
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z 127.0.0.1 9418']
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # P6 backup repository for the AGENTS: rest-server with --private-repos (user <x> can only reach /<x>/) and
  # --append-only (no delete/overwrite except lock files). One htpasswd user per lab server (node-a, node-b),
  # generated into .lab/backup/htpasswd. Reachable as http://lab-backup:8000/<user>/ on the lab network only
  # (helper containers in lab-dind get it via ExtraHosts resolved by the agent). LAB: http, not https.
  lab-backup:
    image: restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
    container_name: ppanel-lab-backup
    hostname: lab-backup
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [labnet]
    entrypoint:
      - rest-server
      - --path=/data
      - --htpasswd-file=/etc/rest-server/htpasswd
      - --private-repos
      - --append-only
      - --listen=:8000
      - --log=-
    volumes:
      - backup-data:/data
      - ${PPANEL_LAB_BACKUP_DIR:-../../.lab/backup}/htpasswd:/etc/rest-server/htpasswd:ro
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8000']
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # P6 MAINTENANCE identity: a second rest-server on the SAME data volume, full access (no --private-repos, no
  # --append-only) for one admin user (.lab/backup/admin-htpasswd). Used ONLY by scripts/backup/maintenance.sh
  # (init / prune / copy / check / unlock). NOT on the nodes' network; published on the Mac loopback only.
  lab-backup-admin:
    image: restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
    container_name: ppanel-lab-backup-admin
    hostname: lab-backup-admin
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backupadmin]
    ports:
      - '127.0.0.1:58001:8000'
    entrypoint:
      - rest-server
      - --path=/data
      - --htpasswd-file=/etc/rest-server/htpasswd
      - --listen=:8000
    volumes:
      - backup-data:/data
      - ${PPANEL_LAB_BACKUP_DIR:-../../.lab/backup}/admin-htpasswd:/etc/rest-server/htpasswd:ro
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8000']
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # P6 offsite copy target (S3-compatible). MinIO community build (pgsty/minio — upstream MinIO no longer publishes
  # images), pinned by digest. Admin network + Mac loopback only; root credentials from .lab/backup/minio.env;
  # bucket `ppanel-offsite` is created by scripts/lab/backup-secrets.sh after start (mc inside the container).
  lab-minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: ppanel-lab-minio
    hostname: lab-minio
    restart: 'no'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backupadmin]
    ports:
      - '127.0.0.1:59000:9000'
    command: ['server', '/data', '--address', ':9000']
    env_file:
      # generated by scripts/lab/backup-secrets.sh; optional so `compose config` works on a fresh checkout / CI
      - path: ${PPANEL_LAB_BACKUP_DIR:-../../.lab/backup}/minio.env
        required: false
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # Tiny upstream behind node-a's reverse-proxy fixture (03-proxy-api.conf).
  lab-upstream-a:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    container_name: ppanel-lab-upstream-a
    command: ['httpd', '-f', '-v', '-p', '8080', '-h', '/www']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ../lab/upstream/a:/www:ro
    networks: [labnet]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/health/']
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      com.ppanel.lab: 'true'

  # Compose-like static app behind node-b (10-shop-compose.conf).
  lab-upstream-b:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    container_name: ppanel-lab-upstream-b
    command: ['httpd', '-f', '-v', '-p', '8080', '-h', '/www']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ../lab/upstream/b:/www:ro
    networks: [labnet]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      com.ppanel.lab: 'true'
      com.docker.compose.fixture.project: shop

  # P7 CHAOS node (profile `chaos`, NOT started by scripts/lab/up.sh): same image as node-a, but the agent
  # state dir is a SIZE-LIMITED tmpfs (6 MiB, RAM-backed) so "disk full" can be simulated for the log buffer
  # and the backup work dir without ever touching the host disk. Started/stopped only by
  # scripts/chaos/disk_full.py:  docker compose -p ppanel-lab -f infra/compose/lab.yml --profile chaos up -d --no-deps lab-node-c
  lab-node-c:
    <<: *node-common
    image: ppanel-lab-node-a:dev
    profiles: [chaos]
    container_name: ppanel-lab-node-c
    hostname: lab-node-c
    tmpfs:
      - /var/lib/ppanel-agent:size=6m,mode=0700
    volumes:
      - ${PPANEL_AGENT_BIN_DIR:-../../.lab/agent-bin}:/opt/ppanel-agent:ro
      - ../lab/node/agent-config/node-c-chaos.yaml:/etc/ppanel-agent/config.yaml:ro

  # ---------------------------------------------------------------------------------------------------------
  # P9 private networking (profile `p9`, NOT started by scripts/lab/up.sh). Started/stopped ONLY by
  # scripts/lab/p9-net.sh (up|down|cut|restore|status), which also attaches the EXISTING node-a / node-b to the
  # "VPC" networks with `docker network connect` — never `compose up` a service that depends on lab-node-b
  # (recreating node-b makes lab-dind lose its network namespace). Lab truth: one region `lab1`, two VPCs:
  #   ppanel-lab-vpc-a 10.110.0.0/24: lab-center-private .2, node-a .11, lab-gateway .20
  #   ppanel-lab-vpc-b 10.120.0.0/24: lab-center-private .2, node-b .12
  # Both VPC networks are `internal` (no route out); the only way from a VPC to the Center's private
  # listener (host :4444) is the lab-center-private forwarder. Cutting a node off its VPC network
  # (`p9-net.sh cut node-a`) is how "private path offline" is tested.

  # TCP forwarder = the Center's PRIVATE gateway endpoint as seen from the VPCs (https://lab-center-private:4444;
  # the name must be in the Center's PPANEL_GATEWAY_HOSTNAMES so the gateway certificate covers it).
  # Plain TCP: TLS (mTLS) is end-to-end between the agent and the Center gateway; socat never sees plaintext.
  lab-center-private:
    image: alpine/socat:1.8.0.1@sha256:87d88ff79bf42ca723fb360e9585c40e2923a2f4df9b9d148b127568ef6b99e7
    profiles: [p9]
    container_name: ppanel-lab-center-private
    hostname: lab-center-private
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['-d', 'tcp-listen:4444,fork,reuseaddr', 'tcp:host.docker.internal:4444']
    networks:
      vpca:
        ipv4_address: 10.110.0.2
        aliases: [lab-center-private]
      vpcb:
        ipv4_address: 10.120.0.2
        aliases: [lab-center-private]
      p9egress: {}
    labels:
      com.ppanel.lab: 'true'

  # Fake DigitalOcean API + per-node droplet metadata (infra/lab/do-fake/server.mjs, no dependencies) on the
  # pinned node:22-alpine image already used by the observability receiver (no extra image on disk).
  # Center: PPANEL_DO_API_BASE=http://127.0.0.1:58090 (Mac loopback only). Agents: provider.metadataUrl
  # http://lab-do-fake:8080/metadata/<node>/v1.json (LAB SUBSTITUTE for http://169.254.169.254/metadata/v1.json).
  lab-do-fake:
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    profiles: [p9]
    container_name: ppanel-lab-do-fake
    hostname: lab-do-fake
    restart: 'no'
    read_only: true
    user: node
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    working_dir: /srv
    command: ['node', '/srv/server.mjs']
    environment:
      PPANEL_LAB_DO_TOKEN: ${PPANEL_LAB_DO_TOKEN:-lab-do-token-not-a-secret}
    volumes:
      - ../lab/do-fake:/srv:ro
    networks: [labnet]
    ports:
      - '127.0.0.1:58090:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # The lab GATEWAY server: same image as node-a (nginx + mounted agent), but its node-a fixture sites are
  # removed at start so it only serves what pPanel renders under /etc/nginx/ppanel-gateway/. On labnet (public
  # path to the Center + upstream DNS for the shared conf.d fixtures) and on vpc-a (private path, backends).
  # Requires ppanel-lab-node-a:dev (built by scripts/lab/up.sh); never built here.
  lab-gateway:
    <<: *node-common
    image: ppanel-lab-node-a:dev
    profiles: [p9]
    container_name: ppanel-lab-gateway
    hostname: lab-gateway
    entrypoint:
      - /usr/bin/tini
      - --
      - /bin/sh
      - -c
      - 'rm -f /etc/nginx/sites-enabled/* && exec /usr/local/bin/ppanel-lab-entrypoint'
    environment:
      PPANEL_LAB_PHP_FPM: '0'
    networks:
      labnet: {}
      vpca:
        ipv4_address: 10.110.0.20
    volumes:
      - ${PPANEL_AGENT_BIN_DIR:-../../.lab/agent-bin}:/opt/ppanel-agent:ro
      - gateway-agent-state:/var/lib/ppanel-agent
      - ../lab/node/agent-config/p9-gateway.yaml:/etc/ppanel-agent/config.yaml:ro

  # ---------------------------------------------------------------------------------------------------------
  # P10 SSH gateway target (profile `p10`, NOT started by scripts/lab/up.sh). Started/stopped ONLY by
  # scripts/lab/p10-ssh.sh (up|down|rekey|status) with `--no-deps` (never recreates node-a/node-b).
  # The node image (same layers as node-a: NODE_ROLE a, php installed but not started) plus WITH_SSHD=1:
  # hardened openssh-server (infra/lab/node/sshd/10-ppanel-lab.conf), user `ops` uid 1001 without password,
  # host keys generated at first start. Fixture sites and the lab-upstream-a upstream are removed at start
  # so it does not depend on the main lab. Extra caps (SYS_CHROOT, AUDIT_WRITE, FOWNER) are for sshd
  # privilege separation / PTY sessions and exist ONLY on this node. sshd is published on the Mac loopback
  # only: 127.0.0.1:52222 -> 22 (the Center's endpoint in the E2E: PPANEL_SSH_LAB_ENDPOINTS=127.0.0.1:52222).
  lab-node-s:
    <<: *node-common
    image: ppanel-lab-node-s:dev
    profiles: [p10]
    build:
      context: ..
      dockerfile: lab/node/Dockerfile
      args: { NODE_ROLE: a, WITH_PHP: '1', WITH_SSHD: '1' }
    container_name: ppanel-lab-node-s
    hostname: lab-node-s
    entrypoint:
      - /usr/bin/tini
      - --
      - /bin/sh
      - -c
      - 'rm -f /etc/nginx/sites-enabled/* /etc/nginx/conf.d/00-upstreams.conf && exec /usr/local/bin/ppanel-lab-entrypoint'
    environment:
      PPANEL_LAB_PHP_FPM: '0'
    cap_add:
      [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE, KILL, SYS_CHROOT, AUDIT_WRITE, FOWNER]
    ports:
      - '127.0.0.1:52222:22'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -s /run/nginx.pid && kill -0 $(cat /run/nginx.pid) && test -s /run/sshd.pid && kill -0 $(cat /run/sshd.pid)',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - ${PPANEL_AGENT_BIN_DIR:-../../.lab/agent-bin}:/opt/ppanel-agent:ro
      - node-s-agent-state:/var/lib/ppanel-agent
      - ../lab/node/agent-config/p10-node-s.yaml:/etc/ppanel-agent/config.yaml:ro

  # P8 LAB SUBSTITUTE for fresh Ubuntu 24.04 VMs (profile `ubuntu`, NOT started by scripts/lab/up.sh).
  # systemd is PID 1; ubuntu-center runs its own Docker Engine (installer target), the nodes run nginx
  # (install-agent.sh targets). !!! privileged: true is REQUIRED (systemd cgroups/mounts, dockerd) and
  # allowed ONLY for these disposable lab containers. Own network, no published ports. Started only by
  # scripts/lab/e2e_p8_install.py:
  #   docker compose -p ppanel-lab -f infra/compose/lab.yml --profile ubuntu up -d --build --no-deps \
  #     ubuntu-center ubuntu-node-1 ubuntu-node-2
  ubuntu-center:
    profiles: [ubuntu]
    image: ppanel-lab-ubuntu-center:dev
    build:
      context: ../lab/ubuntu
      args: { ROLE: center }
    container_name: ppanel-lab-ubuntu-center
    hostname: center
    privileged: true # LAB ONLY — systemd + Docker Engine inside (infra/lab/ubuntu/README.md)
    restart: 'no'
    tmpfs: ['/run', '/run/lock', '/tmp']
    volumes:
      # engine + containerd snapshotter data must not live on the container's own overlay rootfs
      - ubuntu-center-docker:/var/lib/docker
      - ubuntu-center-containerd:/var/lib/containerd
    networks:
      ubuntunet:
        aliases: [center.ppanel.lab]
    labels:
      com.ppanel.lab: 'true'

  ubuntu-node-1:
    profiles: [ubuntu]
    image: ppanel-lab-ubuntu-node:dev
    build:
      context: ../lab/ubuntu
      args: { ROLE: node }
    container_name: ppanel-lab-ubuntu-node-1
    hostname: ubuntu-node-1
    privileged: true # LAB ONLY — systemd PID 1 (unit sandboxing needs mount namespaces)
    restart: 'no'
    tmpfs: ['/run', '/run/lock', '/tmp']
    networks: [ubuntunet]
    labels:
      com.ppanel.lab: 'true'

  ubuntu-node-2:
    profiles: [ubuntu]
    image: ppanel-lab-ubuntu-node:dev
    container_name: ppanel-lab-ubuntu-node-2
    hostname: ubuntu-node-2
    privileged: true # LAB ONLY — systemd PID 1
    restart: 'no'
    tmpfs: ['/run', '/run/lock', '/tmp']
    networks: [ubuntunet]
    depends_on: [ubuntu-node-1] # same image; built once by node-1
    labels:
      com.ppanel.lab: 'true'

networks:
  labnet:
    name: ppanel-lab-net
    driver: bridge
  # P6: maintenance identity + offsite S3 only (never attached to the nodes)
  backupadmin:
    name: ppanel-lab-backup-admin
    driver: bridge
  # P8: Ubuntu systemd lab (profile `ubuntu`) — isolated from the nodes' labnet
  ubuntunet:
    name: ppanel-lab-ubuntu
    driver: bridge
  # P9 (profile `p9`): two lab "VPCs" (internal, no route out) + the private forwarder's own egress network
  vpca:
    name: ppanel-lab-vpc-a
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.110.0.0/24
  vpcb:
    name: ppanel-lab-vpc-b
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.120.0.0/24
  p9egress:
    name: ppanel-lab-p9-egress
    driver: bridge

volumes:
  node-a-agent-state: {}
  node-b-agent-state: {}
  node-b-dind-sock: {}
  node-b-dind-data: {}
  registry-data: {}
  backup-data: {}
  minio-data: {}
  ubuntu-center-docker: {}
  ubuntu-center-containerd: {}
  gateway-agent-state: {}
  node-s-agent-state: {}
