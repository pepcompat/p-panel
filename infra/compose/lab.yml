# pPanel LAB — disposable "node" containers that approximate Ubuntu 24.04 VMs.
# Project name is fixed to `ppanel-lab`; use scripts/lab/{up,down,status,checksum-nginx}.sh.
# Only ONE port is published, loopback-only: the P4 lab registry on 127.0.0.1:55000 (image push from the Mac).
# Sites are reached via `docker exec ... curl -H Host:`.
# P4: lab-node-b gets a docker-in-docker sidecar (lab-dind, PRIVILEGED — lab only, see infra/lab/README.md).
# P4b: lab-node-b is the BUILD NODE (git installed, agent config mounted with build.enabled + gitHostsAllowlist
#      [lab-git]); lab-git serves the fixture repos (.lab/git, scripts/lab/git-fixtures.sh) over git:// read-only.
# P6: lab-backup (rest-server --private-repos --append-only; the nodes' ONLY backup endpoint, lab network only),
#     lab-backup-admin (full-access maintenance identity on the SAME data; NOT on the nodes' network, published on
#     127.0.0.1:58001 only) and lab-minio (offsite S3, 127.0.0.1:59000 only). Credentials are generated into the
#     gitignored .lab/backup/ by scripts/lab/backup-secrets.sh (called by up.sh). Lab shortcut: http, not https.
# Containers are NOT VMs — see infra/lab/README.md for limitations and which tests stay BLOCKED.
name: ppanel-lab

x-node-common: &node-common
  init: false # tini is the image ENTRYPOINT (PID 1)
  restart: 'no'
  extra_hosts:
    # lets the in-container agent reach the Center API (:4000) / agent gateway (:4443) on the Mac host
    - 'host.docker.internal:host-gateway'
  networks: [labnet]
  cap_drop: [ALL]
  # minimum caps for nginx/php-fpm master to bind :80/:443 and drop to www-data
  cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE, KILL]
  security_opt: ['no-new-privileges:true']
  healthcheck:
    test: ['CMD-SHELL', 'test -s /run/nginx.pid && kill -0 $(cat /run/nginx.pid)']
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s
  labels:
    com.ppanel.lab: 'true'

services:
  lab-node-a:
    <<: *node-common
    image: ppanel-lab-node-a:dev
    build:
      context: ..
      dockerfile: lab/node/Dockerfile
      args: { NODE_ROLE: a, WITH_PHP: '1' }
    container_name: ppanel-lab-node-a
    hostname: lab-node-a
    environment:
      PPANEL_LAB_PHP_FPM: '1'
    volumes:
      - ${PPANEL_AGENT_BIN_DIR:-../../.lab/agent-bin}:/opt/ppanel-agent:ro
      - node-a-agent-state:/var/lib/ppanel-agent
      # P6: operator-side agent config (backup.enabled, host restic). Read-only.
      - ../lab/node/agent-config/node-a.yaml:/etc/ppanel-agent/config.yaml:ro
    depends_on:
      lab-upstream-a: { condition: service_healthy }

  lab-node-b:
    <<: *node-common
    image: ppanel-lab-node-b:dev
    build:
      context: ..
      dockerfile: lab/node/Dockerfile
      args: { NODE_ROLE: b, WITH_PHP: '0', WITH_GIT: '1' }
    container_name: ppanel-lab-node-b
    hostname: lab-node-b
    environment:
      # entrypoint links /var/run/docker.sock -> /run/dind/docker.sock (socket of the lab-dind sidecar)
      PPANEL_LAB_DIND_SOCKET: /run/dind/docker.sock
    volumes:
      - ${PPANEL_AGENT_BIN_DIR:-../../.lab/agent-bin}:/opt/ppanel-agent:ro
      - node-b-agent-state:/var/lib/ppanel-agent
      - node-b-dind-sock:/run/dind
      # P4b: operator-side agent config (build node). Produced by the lab tooling, read-only.
      - ../lab/node/agent-config/node-b.yaml:/etc/ppanel-agent/config.yaml:ro
    depends_on:
      lab-upstream-b: { condition: service_healthy }
      lab-git: { condition: service_healthy }

  # P4 deploy target engine for lab-node-b. Docker-in-docker that SHARES node-b's network namespace,
  # so containers it publishes on 127.0.0.1:<port> are on node-b's loopback (like a real host where
  # dockerd and nginx share the host network). Its API socket is on a shared volume, linked into
  # node-b at /var/run/docker.sock. The pPanel agent in node-b talks to it via the Engine API only.
  # !!! privileged: true is REQUIRED by dind and is allowed ONLY for this lab sidecar. NEVER a
  # !!! production pattern; pPanel itself never runs privileged containers.
  lab-dind:
    image: docker:29.0.4-dind@sha256:c9699f4fc7365e8daad3eb48ce3b62dc118b2a5267f7be7bcd3c4e4b2f1cfb4c
    container_name: ppanel-lab-dind
    restart: 'no'
    privileged: true # LAB ONLY — see infra/lab/README.md "docker-in-docker (P4)"
    network_mode: 'service:lab-node-b'
    environment:
      DOCKER_TLS_CERTDIR: '' # unix socket only, no TCP listener
    command:
      - dockerd
      - --host=unix:///run/dind/docker.sock
      - --insecure-registry=lab-registry:5000
      - --bip=10.213.0.1/24
      - --default-address-pool=base=10.214.0.0/16,size=24
      - --log-level=warn
    volumes:
      - node-b-dind-sock:/run/dind
      - node-b-dind-data:/var/lib/docker
    depends_on:
      lab-node-b: { condition: service_healthy }
      lab-registry: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'docker',
          '-H',
          'unix:///run/dind/docker.sock',
          'version',
          '--format',
          '{{.Server.Version}}',
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    labels:
      com.ppanel.lab: 'true'

  # Lab-only TCP forwarder so the SAME image reference works for the Center (on the Mac,
  # 127.0.0.1:55000 -> published registry port) and for dind inside node-b's network namespace
  # (127.0.0.1:55000 -> lab-registry:5000). Needed for webhook auto-deploy, where the Center resolves
  # a tag to a digest and dind then pulls that exact reference. Docker treats 127.0.0.0/8 registries
  # as insecure by default, so no dind flag change is needed.
  lab-registry-fwd:
    image: alpine/socat:1.8.0.1@sha256:87d88ff79bf42ca723fb360e9585c40e2923a2f4df9b9d148b127568ef6b99e7
    container_name: ppanel-lab-registry-fwd
    restart: 'no'
    network_mode: 'service:lab-node-b'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command: ['tcp-listen:55000,bind=127.0.0.1,fork,reuseaddr', 'tcp:lab-registry:5000']
    depends_on:
      lab-node-b: { condition: service_healthy }
      lab-registry: { condition: service_healthy }
    labels:
      com.ppanel.lab: 'true'

  # P4 local OCI registry: dind pulls lab-registry:5000/ppanel-test/* (insecure, lab network only);
  # the Mac pushes via 127.0.0.1:55000 (published on loopback ONLY).
  lab-registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    container_name: ppanel-lab-registry
    hostname: lab-registry
    restart: 'no'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [labnet]
    ports:
      - '127.0.0.1:55000:5000'
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'false'
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:5000/v2/']
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # P4b lab git server: read-only `git daemon` (git://lab-git/<name>.git) for the fixture repos built by
  # scripts/lab/git-fixtures.sh into .lab/git. Lab network only, not published. git:// is accepted by
  # node-b's agent only because its build.gitHostsAllowlist names `lab-git` (lab-only; production = https).
  lab-git:
    image: ppanel-lab-git:dev
    build:
      context: ../lab/git-daemon
    container_name: ppanel-lab-git
    hostname: lab-git
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [labnet]
    volumes:
      - ${PPANEL_LAB_GIT_DIR:-../../.lab/git}:/srv/git:ro
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z 127.0.0.1 9418']
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # P6 backup repository for the AGENTS: rest-server with --private-repos (user <x> can only reach /<x>/) and
  # --append-only (no delete/overwrite except lock files). One htpasswd user per lab server (node-a, node-b),
  # generated into .lab/backup/htpasswd. Reachable as http://lab-backup:8000/<user>/ on the lab network only
  # (helper containers in lab-dind get it via ExtraHosts resolved by the agent). LAB: http, not https.
  lab-backup:
    image: restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
    container_name: ppanel-lab-backup
    hostname: lab-backup
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [labnet]
    entrypoint:
      - rest-server
      - --path=/data
      - --htpasswd-file=/etc/rest-server/htpasswd
      - --private-repos
      - --append-only
      - --listen=:8000
      - --log=-
    volumes:
      - backup-data:/data
      - ${PPANEL_LAB_BACKUP_DIR:-../../.lab/backup}/htpasswd:/etc/rest-server/htpasswd:ro
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8000']
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # P6 MAINTENANCE identity: a second rest-server on the SAME data volume, full access (no --private-repos, no
  # --append-only) for one admin user (.lab/backup/admin-htpasswd). Used ONLY by scripts/backup/maintenance.sh
  # (init / prune / copy / check / unlock). NOT on the nodes' network; published on the Mac loopback only.
  lab-backup-admin:
    image: restic/rest-server:0.14.0@sha256:d2aff06f47eb38637dff580c3e6bce4af98f386c396a25d32eb6727ec96214a5
    container_name: ppanel-lab-backup-admin
    hostname: lab-backup-admin
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backupadmin]
    ports:
      - '127.0.0.1:58001:8000'
    entrypoint:
      - rest-server
      - --path=/data
      - --htpasswd-file=/etc/rest-server/htpasswd
      - --listen=:8000
    volumes:
      - backup-data:/data
      - ${PPANEL_LAB_BACKUP_DIR:-../../.lab/backup}/admin-htpasswd:/etc/rest-server/htpasswd:ro
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8000']
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # P6 offsite copy target (S3-compatible). MinIO community build (pgsty/minio — upstream MinIO no longer publishes
  # images), pinned by digest. Admin network + Mac loopback only; root credentials from .lab/backup/minio.env;
  # bucket `ppanel-offsite` is created by scripts/lab/backup-secrets.sh after start (mc inside the container).
  lab-minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: ppanel-lab-minio
    hostname: lab-minio
    restart: 'no'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backupadmin]
    ports:
      - '127.0.0.1:59000:9000'
    command: ['server', '/data', '--address', ':9000']
    env_file:
      # generated by scripts/lab/backup-secrets.sh; optional so `compose config` works on a fresh checkout / CI
      - path: ${PPANEL_LAB_BACKUP_DIR:-../../.lab/backup}/minio.env
        required: false
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/minio/health/live']
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.ppanel.lab: 'true'

  # Tiny upstream behind node-a's reverse-proxy fixture (03-proxy-api.conf).
  lab-upstream-a:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    container_name: ppanel-lab-upstream-a
    command: ['httpd', '-f', '-v', '-p', '8080', '-h', '/www']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ../lab/upstream/a:/www:ro
    networks: [labnet]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/health/']
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      com.ppanel.lab: 'true'

  # Compose-like static app behind node-b (10-shop-compose.conf).
  lab-upstream-b:
    image: busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    container_name: ppanel-lab-upstream-b
    command: ['httpd', '-f', '-v', '-p', '8080', '-h', '/www']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    volumes:
      - ../lab/upstream/b:/www:ro
    networks: [labnet]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      com.ppanel.lab: 'true'
      com.docker.compose.fixture.project: shop

networks:
  labnet:
    name: ppanel-lab-net
    driver: bridge
  # P6: maintenance identity + offsite S3 only (never attached to the nodes)
  backupadmin:
    name: ppanel-lab-backup-admin
    driver: bridge

volumes:
  node-a-agent-state: {}
  node-b-agent-state: {}
  node-b-dind-sock: {}
  node-b-dind-data: {}
  registry-data: {}
  backup-data: {}
  minio-data: {}
