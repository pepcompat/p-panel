# pPanel agent config for the P9 lab (node-b). LAB ONLY. scripts/lab/e2e_p9.py runs the agent with it:
# copied to /etc/ppanel-agent/p9.yaml in ppanel-lab-node-b and passed with --config (the node's own config.yaml is untouched).
# provider.metadataUrl is the LAB SUBSTITUTE for the DigitalOcean link-local metadata service
# (http://169.254.169.254/metadata/v1.json); production configs never set it.
stateDir: /var/lib/ppanel-agent
logLevel: info
dockerSocket: /var/run/docker.sock
provider:
  metadataUrl: http://lab-do-fake:8080/metadata/node-b/v1.json
