# pPanel LAB sshd hardening (lab-node-s, P10). Installed only when the node image is built with WITH_SSHD=1.
# Ubuntu's /etc/ssh/sshd_config includes sshd_config.d/*.conf before its own settings: first value wins.
# LAB ONLY: this sshd is a target for the Center SSH gateway tests (docs/P10_SSH_CONTRACT.md §8).
Port 22
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
AllowUsers ops
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
GatewayPorts no
PermitTunnel no
X11Forwarding no
PermitUserEnvironment no
PermitUserRC no
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20
ClientAliveInterval 15
ClientAliveCountMax 3
PrintMotd no
# managed keys live in ~/.ssh/authorized_keys (pPanel block written by the agent's ssh.keys.sync)
AuthorizedKeysFile .ssh/authorized_keys
StrictModes yes
LogLevel VERBOSE
