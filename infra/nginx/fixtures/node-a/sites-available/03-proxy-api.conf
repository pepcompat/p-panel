# FIXTURE 03: reverse proxy to a named upstream (conf.d/00-upstreams.conf -> lab-upstream-a:8080),
# nested include, rate limit, websocket upgrade headers.
server {
    listen 80;
    server_name api.example.lab;

    location / {
        limit_req zone=api_rl burst=40 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://legacy_api;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://legacy_api/health/;
    }
}
