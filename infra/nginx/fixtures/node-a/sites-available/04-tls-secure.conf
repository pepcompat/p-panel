# FIXTURE 04: TLS site with self-signed lab cert (generated at image build, never committed)
# plus HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name secure.example.lab;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.24 (Ubuntu 24.04) syntax; 1.25+ prefers `http2 on;`
    server_name secure.example.lab;
    ssl_certificate     /etc/ssl/ppanel-lab/secure.example.lab.crt;
    ssl_certificate_key /etc/ssl/ppanel-lab/secure.example.lab.key;
    ssl_session_cache shared:lab_ssl:1m;
    root /var/www/secure;
    index index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=300" always;
}
