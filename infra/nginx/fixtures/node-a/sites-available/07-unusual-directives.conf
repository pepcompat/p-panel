# FIXTURE 07: unusual / unsupported-for-round-trip directives. Discovery must mark this site
# `unsupported` / `manual_review_required` and keep it in Observe mode (brief §4).
#
# The following need modules NOT installed in the lab (ngx_http_perl_module / lua-nginx-module),
# so they are COMMENTED OUT to keep `nginx -t` passing. The parser must still surface them
# as unsupported (commented-out directives are provenance, not effective config):
# PPANEL-FIXTURE-UNSUPPORTED: perl_modules perl/lib;
# PPANEL-FIXTURE-UNSUPPORTED: perl_set $lab_perl_var 'sub { return "x"; }';
# PPANEL-FIXTURE-UNSUPPORTED: lua_shared_dict lab_cache 1m;
# PPANEL-FIXTURE-UNSUPPORTED: access_by_lua_block { ngx.exit(ngx.OK) }

split_clients "${remote_addr}lab" $lab_variant {
    50%     "a";
    *       "b";
}

geo $lab_internal {
    default        0;
    127.0.0.1/32   1;
    172.16.0.0/12  1;
}

server {
    listen 80;
    server_name unusual.example.lab ~^legacy-(?<tenant>[a-z0-9]+)\.example\.lab$;
    root /var/www/unusual;
    index index.html;

    # if-in-location + rewrite + named location + sub_filter: valid but not safely round-trippable.
    location / {
        if ($lab_internal = 0) {
            add_header X-Lab-External 1;
        }
        rewrite ^/old/(.*)$ /$1 last;
        sub_filter 'fixture' 'fixture[$lab_variant]';
        sub_filter_once off;
        error_page 404 = @fallback;
        try_files $uri $uri/ =404;
    }

    location @fallback {
        return 200 "fallback tenant=$tenant\n";
    }
}
