# FIXTURE 10: reverse proxy to a compose-managed app (/opt/apps/shop/docker-compose.yml).
# The upstream runs in the separate lab container `lab-upstream-b` (port 8080), standing in
# for a container published by Compose on a real host.
server {
    listen 80;
    server_name shop.b.lab www.shop.b.lab;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://lab-upstream-b:8080;
    }
}
