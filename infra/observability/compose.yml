# pPanel observability backends (P5.01, ADR-0008) — lab/dev. Start with scripts/observability/up.sh.
# Everything listens on 127.0.0.1 only: browsers and agents never reach Prometheus/Loki directly.
#   Prometheus 127.0.0.1:59090  (scrapes the Center GET /internal/metrics with a static bearer file)
#   Loki       127.0.0.1:53100  (single binary, filesystem storage, retention via compactor)
#   Mailpit    127.0.0.1:51025 SMTP / 127.0.0.1:58025 UI+API   (email channel lab)
#   receiver   127.0.0.1:58080  (records webhook/Telegram calls; GET /_requests lists them)
# Images are pinned by digest. Retention / size limits come from env (see .env.example).
name: ppanel-observability

services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-2GB}
      - --web.listen-address=:9090
    ports: ['127.0.0.1:59090:9090']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # generated by scripts/observability/up.sh (gitignored, 0600 on the host)
      - ../../.lab/observability/scrape-token:/etc/prometheus/scrape-token:ro
      - promdata:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.7@sha256:0eaee7bf39cc83aaef46914fb58f287d4f4c4be6ec96b86c2ed55719a75e49c8
    command: ['-config.file=/etc/loki/loki.yml', '-config.expand-env=true']
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
      LOKI_INGESTION_RATE_MB: ${LOKI_INGESTION_RATE_MB:-8}
      LOKI_INGESTION_BURST_MB: ${LOKI_INGESTION_BURST_MB:-16}
    ports: ['127.0.0.1:53100:3100']
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3100/ready']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    environment:
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_DISABLE_VERSION_CHECK: '1'
    ports: ['127.0.0.1:51025:1025', '127.0.0.1:58025:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  receiver:
    build: ./receiver
    image: ppanel-observability-receiver:dev
    ports: ['127.0.0.1:58080:8080']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/_health']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  promdata: {}
  lokidata: {}
